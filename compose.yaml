services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studybot
      POSTGRES_USER: studybot
      POSTGRES_PASSWORD: studybot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybot -d studybot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - studybot-postgres-data:/var/lib/postgresql/data

  api:
    build: .
    image: studybot:local
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://studybot:studybot@database:5432/studybot
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  studybot-postgres-data:
