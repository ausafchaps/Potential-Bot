name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci.db
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Check migration drift
        run: python -m alembic check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studybot
          POSTGRES_USER: studybot
          POSTGRES_PASSWORD: studybot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studybot -d studybot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://studybot:studybot@127.0.0.1:5432/studybot
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Check PostgreSQL migration drift
        run: python -m alembic check

      - name: Run PostgreSQL integration test
        run: python -m pytest backend/tests/test_postgres_integration.py -q

  container:
    runs-on: ubuntu-latest
    needs: [quality, postgres]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build --tag studybot:${{ github.sha }} .
